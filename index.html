<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Painel Executivo de Defesa Civil — SEDEC-RJ</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>

  <!-- Nosso arquivo de estilos modularizado -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-title-box">
      <div class="brand-logo-container">
        <img id="imgLogo" src="logo.png" alt="Logo Defesa Civil" onerror="tratarErroLogo(this)">
      </div>
      <div>
        <h1 id="painelTituloPrincipal">Painel Executivo de Defesa Civil</h1>
        <p id="subHeaderStatus">Monitoramento Operacional SEDEC-RJ</p>
      </div>
    </div>
    
    <div class="header-actions">
      <div class="nav-tabs" id="containerNavTabs"></div>
      <div class="status-pill">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Conectando...</span>
      </div>
      <button class="btn-sync" id="btnSync">
        <svg id="syncIcon" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
        </svg>
        <span>Sincronizar</span>
      </button>
    </div>
  </header>

  <!-- BARRA DE CONTROLE DE PERÍODO -->
  <div class="period-highlight-bar" id="barraPeriodo">
    <div class="period-title-group">
      <h2>Filtro de Período</h2>
      <span id="periodoResumoLabel">Selecione as datas para atualizar os dados</span>
    </div>

    <div class="period-inputs-wrap">
      <div class="date-input-field">
        <label>De</label>
        <input type="date" id="dataInicio">
      </div>
      <div class="date-input-field">
        <label>Até</label>
        <input type="date" id="dataFim">
      </div>
      <div class="preset-buttons">
        <button class="btn-preset" data-preset="hoje">Hoje</button>
        <button class="btn-preset" data-preset="7d">7 Dias</button>
        <button class="btn-preset" data-preset="30d">30 Dias</button>
        <button class="btn-preset" data-preset="mes">Mês Atual</button>
        <button class="btn-preset active" data-preset="tudo">Tudo</button>
      </div>
    </div>
  </div>

  <!-- WORKSPACE PRINCIPAL: ESQUERDA (DADOS) vs DIREITA (MAPA) -->
  <main class="main-workspace">
    <div class="col-left">
      <div class="kpi-grid" id="containerKPIs"></div>
      <div class="filter-box" id="containerFiltros"></div>
      <div class="dashboard-grid" id="containerGraficos"></div>

      <!-- TABELA OPERACIONAL -->
      <div class="table-panel">
        <div class="table-top">
          <div>
            <div class="chart-title" id="tabelaTituloAba">Registros Detalhados</div>
            <div id="tabelaContador" style="font-size: 10px; color: var(--text-muted);">Processando...</div>
          </div>
          <div style="display: flex; align-items: center; gap: 6px;">
            <button id="btnAnt" class="pagination-btn">Anterior</button>
            <span id="pageTxt" style="font-size: 11px; color: var(--text-muted);">Pág. 1 / 1</span>
            <button id="btnProx" class="pagination-btn">Próxima</button>
          </div>
        </div>
        <div class="table-wrapper">
          <table id="tabelaPrincipal">
            <thead id="tabelaCabecalho"></thead>
            <tbody id="tabelaCorpo"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- COLUNA DA DIREITA: MAPA FIXADO -->
    <div class="col-right">
      <div class="map-panel" id="painelMapa">
        <div class="map-header">
          <div class="chart-title" id="mapTitle">Estado do Rio de Janeiro (92 municípios)</div>
          <button class="btn-reset-map" id="btnResetMap">Enquadrar Estado</button>
        </div>
        
        <div id="map"></div>

        <div class="map-legend" id="legendContainer">
          <div class="map-legend-item"><div class="map-legend-swatch" style="background:#2454A6;"></div> Na Regional</div>
          <div class="map-legend-item"><div class="map-legend-swatch" style="background:#D4DAE3;"></div> Fora da Seleção</div>
          <div class="map-legend-item"><div class="map-legend-swatch" style="background:#ea580c; border-radius:50%;"></div> Ponto de Ocorrência</div>
        </div>
      </div>
    </div>
  </main>

  <!-- SCRIPTS EXTERNOS E MÓDULOS NA ORDEM CORRETA -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="mapa.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/mapa_controller.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
