<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Painel Executivo de Defesa Civil — SEDEC-RJ</title>

  <!-- CSS do Leaflet -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>

  <style>
    :root {
      --bg-dark: #0b1120;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --orange: #f97316;
      --orange-glow: rgba(249, 115, 22, 0.25);
      --red: #ef4444;
      --blue: #38bdf8;
      --green: #10b981;
      --amber: #f59e0b;
      --accent: #2454A6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; max-width: 100vw; overflow-x: hidden; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 14px 18px;
      line-height: 1.4;
    }

    /* HEADER */
    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 12px;
    }
    .header-title-box { display: flex; align-items: center; gap: 12px; }
    
    .brand-logo-container {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(249, 115, 22, 0.12);
      border: 1px solid var(--orange-glow);
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .brand-logo-container img { width: 100%; height: 100%; object-fit: contain; }

    .header h1 { font-size: 19px; font-weight: 800; color: #fff; }
    .header p { font-size: 11px; color: var(--text-muted); }

    .header-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    
    .nav-tabs {
      display: flex;
      gap: 4px;
      background: #0f172a;
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }
    .tab-btn {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 6px 11px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn:hover { color: #fff; }
    .tab-btn.active {
      background: var(--orange);
      color: #fff;
      box-shadow: 0 2px 8px var(--orange-glow);
    }

    .btn-sync {
      background: #1e293b;
      color: var(--orange);
      border: 1px solid #334155;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-sync:hover { background: #334155; border-color: var(--orange); }
    .btn-sync.spinning svg { animation: rot 1s linear infinite; }
    @keyframes rot { 100% { transform: rotate(360deg); } }

    .status-pill {
      font-size: 10.5px;
      padding: 4px 8px;
      border-radius: 20px;
      background: #0f172a;
      border: 1px solid var(--border-color);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #94a3b8; }
    .dot.online { background: #10b981; box-shadow: 0 0 6px #10b981; }
    .dot.syncing { background: #f59e0b; }
    .dot.offline { background: #ef4444; }

    /* CONTROLE DE PERÍODO */
    .period-highlight-bar {
      background: linear-gradient(180deg, #1e293b 0%, #151f30 100%);
      border: 1px solid var(--orange);
      box-shadow: 0 4px 14px var(--orange-glow);
      border-radius: 10px;
      padding: 8px 14px;
      margin-bottom: 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .period-title-group h2 { font-size: 12px; font-weight: 800; color: #fff; text-transform: uppercase; }
    .period-title-group span { font-size: 11px; color: var(--orange); font-weight: 500; }

    .period-inputs-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .date-input-field {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0b1120;
      border: 1px solid var(--border-color);
      padding: 4px 8px;
      border-radius: 6px;
    }
    .date-input-field label { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .date-input-field input[type="date"] {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }
    .date-input-field input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.9); cursor: pointer; }

    .preset-buttons { display: flex; flex-wrap: wrap; gap: 4px; }
    .btn-preset {
      background: #0b1120;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 4px 8px;
      font-size: 10px;
      font-weight: 700;
      border-radius: 5px;
      cursor: pointer;
    }
    .btn-preset:hover, .btn-preset.active { background: var(--orange); color: #fff; border-color: var(--orange); }

    /* LAYOUT DE 2 COLUNAS (FIXO, SEM ENCOLHER O MAPA) */
    .main-workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(460px, 0.85fr);
      gap: 16px;
      align-items: start;
      width: 100%;
    }

    @media (max-width: 1080px) {
      .main-workspace { grid-template-columns: 1fr; }
      .col-right { position: static !important; width: 100%; min-width: 100%; }
    }

    .col-left {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .col-right {
      min-width: 460px;
      position: sticky;
      top: 12px;
    }

    /* CARDS DE KPIS */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
    }
    .kpi-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .kpi-label { font-size: 9.5px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }
    .kpi-val { font-size: 19px; font-weight: 800; margin: 2px 0; color: #fff; }
    .kpi-sub { font-size: 9.5px; color: var(--text-muted); }

    /* FILTROS */
    .filter-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }
    .filter-group label {
      display: block;
      font-size: 9.5px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 3px;
    }
    .filter-group select, .filter-group input {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 6px 8px;
      border-radius: 5px;
      font-size: 11px;
      outline: none;
    }
    .filter-group select:focus, .filter-group input:focus { border-color: var(--orange); }

    /* PAINEL DO MAPA À DIREITA */
    .map-panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      width: 100%;
    }
    .map-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .map-header .chart-title { font-size: 11.5px; font-weight: 800; text-transform: uppercase; color: #fff; }

    .btn-reset-map {
      background: #0f172a;
      color: var(--orange);
      border: 1px solid var(--border-color);
      padding: 4px 9px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-reset-map:hover { background: #334155; }

    #map {
      height: 540px;
      width: 100%;
      min-width: 100%;
      border-radius: 6px;
      background: #EEF1F4;
    }

    /* TOOLTIP E POPUP */
    .mun-tooltip {
      background: rgba(22, 36, 63, 0.94);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      font-family: sans-serif;
      font-size: 11px;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      pointer-events: none;
    }
    .leaflet-popup-content-wrapper {
      border-radius: 6px;
      font-family: sans-serif;
      font-size: 13px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    }
    .leaflet-popup-content { margin: 10px 14px; line-height: 1.4; }
    .popup-nome { font-weight: 700; font-size: 14px; margin-bottom: 2px; color: #16243F; }
    .popup-redec { font-family: monospace; font-size: 11px; color: #5B6B82; margin-bottom: 6px; }

    .map-legend {
      background: white;
      border: 1px solid #C7CDD6;
      border-radius: 5px;
      padding: 8px 10px;
      font-family: sans-serif;
      font-size: 10.5px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      color: #16243F;
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .map-legend-item { display: flex; align-items: center; gap: 4px; }
    .map-legend-swatch {
      width: 13px;
      height: 13px;
      border-radius: 2px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      flex-shrink: 0;
    }

    /* GRÁFICOS */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }
    .chart-panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
    }
    .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .chart-title { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #fff; }

    .bar-row { margin-bottom: 6px; }
    .bar-label-line { display: flex; justify-content: space-between; font-size: 10.5px; margin-bottom: 2px; }
    .bar-track { background: #0f172a; height: 7px; border-radius: 4px; overflow: hidden; display: flex; }
    .bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease; }

    /* TABELA */
    .table-panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
    }
    .table-top {
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
      gap: 8px;
    }
    .table-wrapper { max-height: 360px; overflow: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 11px; }
    th {
      background: #0f172a;
      padding: 8px 10px;
      font-size: 9.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    td { padding: 8px 10px; border-bottom: 1px solid #33415560; }
    tr:hover td { background: rgba(255, 255, 255, 0.02); }

    .badge {
      display: inline-block;
      padding: 2px 5px;
      border-radius: 3px;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      margin-right: 3px;
    }
    .badge-arvore { background: #022c22; color: #34d399; border: 1px solid #065f46; }
    .badge-ativo { background: #064e3b; color: #6ee7b7; border: 1px solid #047857; }

    .pagination-btn {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 10px;
      cursor: pointer;
    }
    .pagination-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <div class="header-title-box">
      <div class="brand-logo-container">
        <img id="imgLogo" src="logo.png" alt="Logo Defesa Civil" onerror="tratarErroLogo(this)">
      </div>
      <div>
        <h1 id="painelTituloPrincipal">Painel Executivo de Defesa Civil</h1>
        <p id="subHeaderStatus">Monitoramento Operacional SEDEC-RJ</p>
      </div>
    </div>
    
    <div class="header-actions">
      <div class="nav-tabs" id="containerNavTabs"></div>

      <div class="status-pill">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Conectando...</span>
      </div>

      <button class="btn-sync" id="btnSync">
        <svg id="syncIcon" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
        </svg>
        <span>Sincronizar</span>
      </button>
    </div>
  </div>

  <!-- BARRA DE CONTROLE DE PERÍODO -->
  <div class="period-highlight-bar" id="barraPeriodo">
    <div class="period-title-group">
      <h2>Filtro de Período</h2>
      <span id="periodoResumoLabel">Selecione as datas para atualizar os dados</span>
    </div>

    <div class="period-inputs-wrap">
      <div class="date-input-field">
        <label>De</label>
        <input type="date" id="dataInicio">
      </div>
      <div class="date-input-field">
        <label>Até</label>
        <input type="date" id="dataFim">
      </div>
      <div class="preset-buttons">
        <button class="btn-preset" data-preset="hoje">Hoje</button>
        <button class="btn-preset" data-preset="7d">7 Dias</button>
        <button class="btn-preset" data-preset="30d">30 Dias</button>
        <button class="btn-preset" data-preset="mes">Mês Atual</button>
        <button class="btn-preset active" data-preset="tudo">Tudo</button>
      </div>
    </div>
  </div>

  <!-- WORKSPACE PRINCIPAL: ESQUERDA (DADOS) vs DIREITA (MAPA) -->
  <div class="main-workspace">
    
    <!-- COLUNA DA ESQUERDA: KPIS, FILTROS, GRÁFICOS E TABELA -->
    <div class="col-left">
      <div class="kpi-grid" id="containerKPIs"></div>
      <div class="filter-box" id="containerFiltros"></div>
      <div class="dashboard-grid" id="containerGraficos"></div>

      <!-- TABELA OPERACIONAL -->
      <div class="table-panel">
        <div class="table-top">
          <div>
            <div class="chart-title" id="tabelaTituloAba">Registros Detalhados</div>
            <div id="tabelaContador" style="font-size: 10px; color: var(--text-muted);">Processando...</div>
          </div>
          <div style="display: flex; align-items: center; gap: 6px;">
            <button id="btnAnt" class="pagination-btn">Anterior</button>
            <span id="pageTxt" style="font-size: 11px; color: var(--text-muted);">Pág. 1 / 1</span>
            <button id="btnProx" class="pagination-btn">Próxima</button>
          </div>
        </div>
        <div class="table-wrapper">
          <table id="tabelaPrincipal">
            <thead id="tabelaCabecalho"></thead>
            <tbody id="tabelaCorpo"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- COLUNA DA DIREITA: MAPA FIXADO -->
    <div class="col-right">
      <div class="map-panel" id="painelMapa">
        <div class="map-header">
          <div class="chart-title" id="mapTitle">Estado do Rio de Janeiro (92 municípios)</div>
          <button class="btn-reset-map" id="btnResetMap">Enquadrar Estado</button>
        </div>
        
        <div id="map"></div>

        <div class="map-legend" id="legendContainer">
          <div class="map-legend-item"><div class="map-legend-swatch" style="background:#D4DAE3;"></div> Sem chamados</div>
          <div class="map-legend-item"><div class="map-legend-swatch" style="background:#fed7aa;"></div> 1 - 5</div>
          <div class="map-legend-item"><div class="map-legend-swatch" style="background:#fb923c;"></div> 6 - 20</div>
          <div class="map-legend-item"><div class="map-legend-swatch" style="background:#ea580c;"></div> 21 - 50</div>
          <div class="map-legend-item"><div class="map-legend-swatch" style="background:#b91c1c;"></div> > 50</div>
          <div class="map-legend-item">🔴 Ponto de Evento</div>
        </div>
      </div>
    </div>

  </div>

  <!-- SCRIPT DO LEAFLET E MAPA.JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="mapa.js"></script>

    const CONFIG_MODULOS = {
      "SISGEO": { ativo: true, rotulo: "SISGEO (Ocorrências)", tipo: "sisgeo", temPeriodo: true },
      "EVENTOS REDECS": { ativo: true, rotulo: "Eventos Operacionais", tipo: "eventos", temPeriodo: true },
      "DECRETAÇÃO": { ativo: true, rotulo: "Decretos de Emergência", tipo: "decretacao", temPeriodo: false },
      "PONTOS DE APOIO": { ativo: true, rotulo: "Pontos de Apoio", tipo: "pontos_apoio", temPeriodo: true },
      "AJUDA HUMANITÁRIA": { ativo: true, rotulo: "Ajuda Humanitária", tipo: "ajuda_humanitaria", temPeriodo: true }
    };

    const CONFIG_URL_PLANILHA = "https://script.google.com/macros/s/AKfycbwC7sf80Z2HSS2PewAnM8T_AAOA9rn8KNGEA_pVoA0xcevecSisJrBPQi472V65Qo0l/exec";
    const INTERVALO_AUTO_SYNC_MS = 5 * 60 * 1000;

    let abaAtiva = "SISGEO";
    let todosRegistros = [];
    let filtrados = [];
    let pagina = 1;
    const porPagina = 8;

    /* Variáveis do Mapa Leaflet */
    let mapInstance = null;
    let markersLayerGroup = null;
    let currentScopeBounds = null;
    let popupCloseTimer = null;
    let redecAtiva = "ALL";
    let MUNICIPIOS_ESCOPO = [];
    let geojsonDataGlobal = null;

    function tratarErroLogo(img) {
      img.parentElement.innerHTML = '<span style="font-size:24px;">🛡️</span>';
    }

    function normalizarTexto(s) {
      return String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    }

    function getNomeCanonicoMunicipio(nomeMun) {
      if (MAPA_REDECS_RJ[nomeMun]) return nomeMun;
      const nKey = normalizarTexto(nomeMun);
      for (const k of Object.keys(MAPA_REDECS_RJ)) {
        if (normalizarTexto(k) === nKey) return k;
      }
      return String(nomeMun || "").trim();
    }

    function getRedecDoMunicipio(nomeMun) {
      const canonico = getNomeCanonicoMunicipio(nomeMun);
      return MAPA_REDECS_RJ[canonico] || "Outra REDEC";
    }

    function atualizarMunicipiosEscopo() {
      if (redecAtiva === "ALL" || redecAtiva === "TODAS") {
        MUNICIPIOS_ESCOPO = Object.keys(MAPA_REDECS_RJ).sort((a, b) => a.localeCompare(b, "pt-BR"));
        const el = document.getElementById("mapTitle");
        if (el) el.textContent = "Estado do Rio de Janeiro (92 municípios)";
      } else {
        MUNICIPIOS_ESCOPO = Object.keys(MAPA_REDECS_RJ)
          .filter(m => normalizarTexto(MAPA_REDECS_RJ[m]) === normalizarTexto(redecAtiva))
          .sort((a, b) => a.localeCompare(b, "pt-BR"));
        const el = document.getElementById("mapTitle");
        if (el) el.textContent = `Estado do Rio de Janeiro — ${redecAtiva}`;
      }
    }

    function normalizarDataParaISO(dataBruta) {
      if (!dataBruta) return '';
      let str = String(dataBruta).replace(/[`´']/g, '').trim();
      const mIso = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (mIso) return `${mIso[1]}-${mIso[2].padStart(2, '0')}-${mIso[3].padStart(2, '0')}`;
      const mBr = str.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
      if (mBr) {
        let y = mBr[3].length === 2 ? "20" + mBr[3] : mBr[3];
        return `${y}-${mBr[2].padStart(2, '0')}-${mBr[1].padStart(2, '0')}`;
      }
      return '';
    }

    function formatarParaDDMMAAAA(dataISO) {
      if (!dataISO) return '-';
      const p = dataISO.split('-');
      return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : dataISO;
    }

    function parseNum(val) {
      if (val === undefined || val === null || val === "") return 0;
      const n = parseFloat(String(val).replace(/\./g, "").replace(",", "."));
      return isNaN(n) ? 0 : n;
    }

    /* =========================================================================
       2. REGRAS VISUAIS DE COROPLÉTICO E PREENCHIMENTO POR REDEC
       ========================================================================= */
    function obterCorPorQuantidade(qtd) {
      if (qtd > 50) return '#b91c1c'; // Vermelho vivo
      if (qtd > 20) return '#ea580c'; // Laranja intenso
      if (qtd > 5)  return '#fb923c'; // Laranja médio
      if (qtd > 0)  return '#fed7aa'; // Pêssego suave
      return '#D4DAE3';               // Cinzento claro (sem ocorrências)
    }

    function obterEstiloFeature(feature, escopoSet, contagemMun) {
      const canonico = getNomeCanonicoMunicipio(feature.properties.NM_MUN);
      const isNoEscopo = escopoSet.has(normalizarTexto(canonico));
      const qtd = contagemMun[normalizarTexto(canonico)] || 0;
      const isRedecEspecifica = (redecAtiva !== "ALL" && redecAtiva !== "TODAS");

      if (isRedecEspecifica) {
        if (isNoEscopo) {
          // DENTRO DA REDEC SELECIONADA: TOTALMENTE PREENCHIDO
          return {
            fillColor: qtd > 0 ? obterCorPorQuantidade(qtd) : "#2454A6",
            fillOpacity: 0.85,
            color: "#ffffff",
            weight: 2,
            opacity: 1
          };
        } else {
          // FORA DA REDEC SELECIONADA: APENAS O CONTORNO (TRANSPARENTE)
          return {
            fillColor: "transparent",
            fillOpacity: 0,
            color: "#64748B",
            weight: 0.8,
            dashArray: "2, 2",
            opacity: 0.5
          };
        }
      } else {
        // VISÃO GERAL (TODAS AS REDECS): COROPLÉTICO PREENCHIDO
        return {
          fillColor: obterCorPorQuantidade(qtd),
          fillOpacity: qtd > 0 ? 0.85 : 0.5,
          color: "#ffffff",
          weight: 1.2,
          opacity: 1
        };
      }
    }

    // CARREGADOR SEGURO DO GEOJSON COM RETENTATIVAS E FETCH
    async function obterGeoJsonSeguro() {
      if (geojsonDataGlobal && geojsonDataGlobal.features) return geojsonDataGlobal;
      try {
        if (typeof GEOJSON !== "undefined" && GEOJSON.features) {
          geojsonDataGlobal = GEOJSON;
          return geojsonDataGlobal;
        }
        if (window.GEOJSON && window.GEOJSON.features) {
          geojsonDataGlobal = window.GEOJSON;
          return geojsonDataGlobal;
        }
      } catch (e) {}

      // Se a variável ainda não estava no escopo, busca via fetch relativo
      try {
        const resp = await fetch("./mapa.js");
        if (resp.ok) {
          const jsText = await resp.text();
          // Extrai o conteúdo JSON após a declaração da constante
          const jsonStart = jsText.indexOf("{");
          const jsonEnd = jsText.lastIndexOf("}");
          if (jsonStart !== -1 && jsonEnd !== -1) {
            const rawJson = jsText.substring(jsonStart, jsonEnd + 1);
            geojsonDataGlobal = JSON.parse(rawJson);
            return geojsonDataGlobal;
          }
        }
      } catch (err) {
        console.warn("Aguardando script mapa.js carregar...");
      }
      return null;
    }

    function initMap() {
      if (!mapInstance) {
        mapInstance = L.map("map", { zoomControl: true, scrollWheelZoom: false }).setView([-22.35, -42.7], 7.5);
        
        L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
          attribution: "Tiles &copy; Esri &mdash; SEDEC RJ",
          maxZoom: 14
        }).addTo(mapInstance);

        markersLayerGroup = L.layerGroup().addTo(mapInstance);

        mapInstance.on("popupclose", function() {
          popupCloseTimer = setTimeout(function() {
            let hasOpen = false;
            mapInstance.eachLayer(l => { if (l instanceof L.Popup) hasOpen = true; });
            if (!hasOpen && currentScopeBounds && currentScopeBounds.isValid()) {
              mapInstance.fitBounds(currentScopeBounds, { padding: [14, 14], animate: true, duration: 0.6 });
            }
          }, 80);
        });

        mapInstance.on("popupopen", function() {
          if (popupCloseTimer) {
            clearTimeout(popupCloseTimer);
            popupCloseTimer = null;
          }
        });
      }

      atualizarCamadasMapa();
    }

    async function atualizarCamadasMapa() {
      if (!mapInstance) return;

      atualizarMunicipiosEscopo();
      const ESCOPO_SET = new Set(MUNICIPIOS_ESCOPO.map(m => normalizarTexto(m)));

      // Contagem de ocorrências por município
      const contagemMun = {};
      filtrados.forEach(item => {
        const cNome = getNomeCanonicoMunicipio(item.m);
        const norm = normalizarTexto(cNome);
        if (norm) contagemMun[norm] = (contagemMun[norm] || 0) + (item.o || 1);
      });

      if (window._geojsonLayer) {
        mapInstance.removeLayer(window._geojsonLayer);
      }
      markersLayerGroup.clearLayers();

      const dadosGeoJson = await obterGeoJsonSeguro();

      if (dadosGeoJson && dadosGeoJson.features && dadosGeoJson.features.length) {
        function onEachFeature(feature, layer) {
          const canonico = getNomeCanonicoMunicipio(feature.properties.NM_MUN);
          const isNoEscopo = ESCOPO_SET.has(normalizarTexto(canonico));
          const redecNome = getRedecDoMunicipio(canonico);
          const qtd = contagemMun[normalizarTexto(canonico)] || 0;

          layer.bindTooltip(`<b>${canonico}</b><br><span style="font-size:10px;opacity:.85;">${redecNome}</span><br><b>${qtd}</b> ocorrência(s)`, {
            sticky: true,
            direction: "top",
            offset: [0, -10],
            className: "mun-tooltip",
            opacity: 1
          });

          layer.on({
            mouseover(e) {
              e.target.setStyle({ fillOpacity: 0.95, weight: 2.5, color: "#16243F" });
            },
            mouseout(e) {
              window._geojsonLayer.resetStyle(e.target);
              e.target.closeTooltip();
            },
            click(e) {
              e.target.closeTooltip();
              const popupContent = `
                <div class="popup-nome">${canonico}</div>
                <div class="popup-redec">${redecNome}</div>
                <div style="font-size:12px;color:#16243F;margin-top:4px;">
                  <strong>${qtd}</strong> ocorrência(s) registrada(s) no filtro atual.
                </div>
              `;
              e.target.bindPopup(popupContent).openPopup();
              mapInstance.fitBounds(e.target.getBounds(), { padding: [35, 35], animate: true, duration: 0.6 });
            }
          });
        }

        window._geojsonLayer = L.geoJSON(dadosGeoJson, {
          style: (feat) => obterEstiloFeature(feat, ESCOPO_SET, contagemMun),
          onEachFeature
        }).addTo(mapInstance);

        // Enquadramento de bounds suave
        const camadasEscopo = window._geojsonLayer.getLayers().filter(l => 
          ESCOPO_SET.has(normalizarTexto(getNomeCanonicoMunicipio(l.feature.properties.NM_MUN)))
        );

        if (camadasEscopo.length > 0) {
          const bounds = L.featureGroup(camadasEscopo).getBounds();
          if (bounds.isValid()) {
            currentScopeBounds = bounds;
            mapInstance.fitBounds(bounds, { padding: [18, 18], animate: true });
          }
        } else {
          currentScopeBounds = window._geojsonLayer.getBounds();
          mapInstance.fitBounds(currentScopeBounds, { padding: [10, 10], animate: true });
        }
      } else {
        // Se ainda não carregou, tenta de novo em 300ms
        setTimeout(atualizarCamadasMapa, 300);
      }

      // Plota os marcadores de ocorrências
      const pontosComCoords = filtrados.filter(i => i.tem_coords);
      pontosComCoords.slice(0, 300).forEach(pt => {
        const marker = L.circleMarker([pt.lat, pt.lon], {
          radius: 4.5,
          fillColor: '#ea580c',
          color: '#ffffff',
          weight: 1.5,
          opacity: 1,
          fillOpacity: 0.95
        });

        marker.bindPopup(`
          <div style="font-size:11.5px; line-height:1.4;">
            <strong style="color:#ea580c;">${pt.tipo || 'Ocorrência'}</strong><br>
            <strong>${pt.m}</strong> - ${pt.bairro || ''}<br>
            <span style="color:#64748b; font-size:11px;">${pt.endereco || ''}</span><br>
            <span style="color:#0284c7; font-size:10px;">Vtr: ${pt.viatura || '-'} | ${pt.d_fmt} ${pt.h}</span>
          </div>
        `);
        markersLayerGroup.addLayer(marker);
      });

      setTimeout(() => {
        if (mapInstance) mapInstance.invalidateSize({ animate: false });
      }, 60);
    }

    /* =========================================================================
       3. PADRONIZAÇÃO DAS LINHAS DA PLANILHA
       ========================================================================= */
    function padronizarLinha(raw, tipo) {
      const keys = Object.keys(raw);
      const findKey = (term) => keys.find(k => k.includes(term));

      if (tipo === "sisgeo") {
        const kData = findKey("Data Ocorrência") || findKey("DATA") || keys[3];
        const kMun = findKey("Município") || findKey("MUNIC") || keys[15];
        const kTipo = findKey("Tipo") || keys[5];
        const kSubtipo = findKey("Subtipo") || keys[6];
        const kCoords = findKey("Latitude/Longitude") || findKey("COORD") || keys[17];
        const kEnd = findKey("Endereço") || keys[8];
        const kBairro = findKey("Bairro") || keys[19];
        const kViatura = findKey("Viatura") || keys[7];

        const dIso = normalizarDataParaISO(raw[kData]);
        const munBruto = raw[kMun] ? String(raw[kMun]).trim() : 'NÃO INFORMADO';
        const canonico = getNomeCanonicoMunicipio(munBruto);
        
        let lat = null, lon = null;
        const coordsStr = String(raw[kCoords] || '').trim();
        if (coordsStr.includes(',')) {
          const parts = coordsStr.split(',');
          const pLat = parseFloat(parts[0].trim());
          const pLon = parseFloat(parts[1].trim());
          if (!isNaN(pLat) && !isNaN(pLon) && pLat < 0 && pLon < 0) {
            lat = pLat; lon = pLon;
          }
        }

        return {
          d_iso: dIso,
          d_fmt: formatarParaDDMMAAAA(dIso),
          h: raw[kData] ? String(raw[kData]).substring(11, 16) : '',
          m: canonico,
          r: getRedecDoMunicipio(canonico),
          tipo: raw[kTipo] ? String(raw[kTipo]).trim() : 'Outros',
          subtipo: raw[kSubtipo] ? String(raw[kSubtipo]).trim() : '',
          endereco: raw[kEnd] ? String(raw[kEnd]).trim() : '',
          bairro: raw[kBairro] ? String(raw[kBairro]).trim() : '',
          viatura: raw[kViatura] ? String(raw[kViatura]).trim() : '',
          lat: lat, lon: lon,
          tem_coords: (lat !== null && lon !== null)
        };
      } else if (tipo === "eventos") {
        const dIso = normalizarDataParaISO(raw[findKey("DATA")]);
        const munBruto = raw[findKey("MUNIC")] ? String(raw[findKey("MUNIC")]).trim() : 'NÃO INFORMADO';
        const canonico = getNomeCanonicoMunicipio(munBruto);

        return {
          d_iso: dIso,
          d_fmt: formatarParaDDMMAAAA(dIso),
          h: raw[findKey("HORA")] ? String(raw[findKey("HORA")]).substring(0, 5) : '',
          m: canonico,
          r: getRedecDoMunicipio(canonico),
          desc: raw[findKey("DESCRI")] ? String(raw[findKey("DESCRI")]).trim() : '',
          o: parseNum(raw[findKey("SOMAT")]),
          ob: parseNum(raw[findKey("ÓBITOS")] || raw[findKey("OBITOS")]),
          db: parseNum(raw[findKey("DESABRIG")]),
          dl: parseNum(raw[findKey("DESALOJ")]),
          af: parseNum(raw[findKey("AFETADOS")]),
          dz: parseNum(raw[findKey("DESLIZ")]),
          in: parseNum(raw[findKey("INUNDA")]),
          ar: parseNum(raw[findKey("ÁRVORE")]),
          es: parseNum(raw[findKey("DESABAMENTO")]),
          pa: parseNum(raw[findKey("PONTOS DE APOIO")]),
          sr: parseNum(raw[findKey("SIRENE - MOBILIZA")]),
          dc: raw[findKey("DECRETO")] ? String(raw[findKey("DECRETO")]).trim() : '',
          lat: null, lon: null, tem_coords: false
        };
      }
      return raw;
    }

    /* =========================================================================
       4. CICLO DE VIDA E EVENTOS
       ========================================================================= */
    window.addEventListener("DOMContentLoaded", () => {
      atualizarMunicipiosEscopo();
      renderizarBotoesNavegacao();
      configurarEventosGerais();
      initMap();
      carregarModulo(abaAtiva);

      document.getElementById("btnResetMap").addEventListener("click", () => {
        redecAtiva = "ALL";
        const sel = document.getElementById("filtroRedec");
        if (sel) sel.value = "TODAS";
        filtrar();
      });

      setInterval(() => {
        sincronizarAba(abaAtiva, true);
      }, INTERVALO_AUTO_SYNC_MS);
    });

    function renderizarBotoesNavegacao() {
      const container = document.getElementById("containerNavTabs");
      container.innerHTML = "";
      Object.entries(CONFIG_MODULOS).forEach(([nomeAba, conf]) => {
        if (!conf.ativo) return;
        const btn = document.createElement("button");
        btn.className = `tab-btn ${nomeAba === abaAtiva ? 'active' : ''}`;
        btn.textContent = conf.rotulo || nomeAba;
        btn.addEventListener("click", () => {
          document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          abaAtiva = nomeAba;
          redecAtiva = "ALL";
          carregarModulo(nomeAba);
        });
        container.appendChild(btn);
      });
    }

    function configurarEventosGerais() {
      document.getElementById("btnSync").addEventListener("click", () => sincronizarAba(abaAtiva, false));
      
      const dIni = document.getElementById("dataInicio");
      const dFim = document.getElementById("dataFim");
      dIni.addEventListener("input", () => { desmarcarPresets(); filtrar(); });
      dFim.addEventListener("input", () => { desmarcarPresets(); filtrar(); });
      dIni.addEventListener("change", () => { desmarcarPresets(); filtrar(); });
      dFim.addEventListener("change", () => { desmarcarPresets(); filtrar(); });

      document.querySelectorAll(".btn-preset").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".btn-preset").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          aplicarPresetPeriodo(btn.dataset.preset);
        });
      });

      document.getElementById("btnAnt").addEventListener("click", () => {
        if (pagina > 1) { pagina--; renderizarTabela(); }
      });
      document.getElementById("btnProx").addEventListener("click", () => {
        const totalPags = Math.ceil(filtrados.length / porPagina) || 1;
        if (pagina < totalPags) { pagina++; renderizarTabela(); }
      });
    }

    function desmarcarPresets() {
      document.querySelectorAll(".btn-preset").forEach(b => b.classList.remove("active"));
    }

    function aplicarPresetPeriodo(tipo) {
      const dIni = document.getElementById("dataInicio");
      const dFim = document.getElementById("dataFim");
      const hoje = new Date();
      const formatIso = (d) => d.toISOString().substring(0, 10);

      if (tipo === "hoje") {
        dIni.value = formatIso(hoje); dFim.value = formatIso(hoje);
      } else if (tipo === "7d") {
        const pass = new Date(); pass.setDate(hoje.getDate() - 7);
        dIni.value = formatIso(pass); dFim.value = formatIso(hoje);
      } else if (tipo === "30d") {
        const pass = new Date(); pass.setDate(hoje.getDate() - 30);
        dIni.value = formatIso(pass); dFim.value = formatIso(hoje);
      } else if (tipo === "mes") {
        const prim = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
        dIni.value = formatIso(prim); dFim.value = formatIso(hoje);
      } else if (tipo === "tudo") {
        definirLimitesDatasIniciais();
      }
      filtrar();
    }

    function carregarModulo(nomeAba) {
      const conf = CONFIG_MODULOS[nomeAba] || { tipo: "generico", temPeriodo: false };
      
      document.getElementById("barraPeriodo").style.display = conf.temPeriodo ? "flex" : "none";
      document.getElementById("tabelaTituloAba").textContent = conf.rotulo || nomeAba;

      const cacheData = localStorage.getItem("cache_aba_" + nomeAba);
      const cacheTime = localStorage.getItem("time_aba_" + nomeAba);

      if (cacheData) {
        try {
          todosRegistros = JSON.parse(cacheData);
          atualizarStatusConexao("online", `${conf.rotulo || nomeAba} (Cache)`);
          montarEstruturaModulo(conf.tipo);
          if (conf.temPeriodo) definirLimitesDatasIniciais();
          filtrar();
        } catch (e) {
          console.error("Erro no cache:", e);
        }
      }

      sincronizarAba(nomeAba, false);
    }

    async function sincronizarAba(nomeAba, isBackground) {
      const conf = CONFIG_MODULOS[nomeAba] || { tipo: "generico" };
      const syncBtn = document.getElementById("btnSync");

      if (!isBackground) {
        syncBtn.classList.add("spinning");
        atualizarStatusConexao("syncing", `Carregando ${conf.rotulo || nomeAba}...`);
      }

      try {
        const urlFetch = `${CONFIG_URL_PLANILHA}?aba=${encodeURIComponent(nomeAba)}&t=${Date.now()}`;
        const resp = await fetch(urlFetch);
        const json = await resp.json();

        if (json && json.data) {
          const dadosPadronizados = json.data.map(r => padronizarLinha(r, conf.tipo));
          todosRegistros = dadosPadronizados;
          localStorage.setItem("cache_aba_" + nomeAba, JSON.stringify(dadosPadronizados));
          localStorage.setItem("time_aba_" + nomeAba, new Date().toISOString());

          montarEstruturaModulo(conf.tipo);
          if (conf.temPeriodo) definirLimitesDatasIniciais();
          filtrar();
          atualizarStatusConexao("online", `${conf.rotulo || nomeAba} atualizado (${dadosPadronizados.length} registros)`);
        }
      } catch (err) {
        console.error("Erro:", err);
        atualizarStatusConexao(todosRegistros.length > 0 ? "syncing" : "offline", "Erro de Conexão");
      } finally {
        syncBtn.classList.remove("spinning");
      }
    }

    function atualizarStatusConexao(tipo, texto) {
      document.getElementById("statusDot").className = "dot " + tipo;
      document.getElementById("statusText").textContent = texto;
      document.getElementById("subHeaderStatus").textContent = texto;
    }

    function montarEstruturaModulo(tipo) {
      const cKPIs = document.getElementById("containerKPIs");
      const cFiltros = document.getElementById("containerFiltros");
      const cGraficos = document.getElementById("containerGraficos");

      cKPIs.innerHTML = ""; cFiltros.innerHTML = ""; cGraficos.innerHTML = "";

      if (tipo === "sisgeo") {
        cKPIs.innerHTML = `
          <div class="kpi-card" style="border-left: 3px solid var(--orange);"><div class="kpi-label">Ocorrências SISGEO</div><div class="kpi-val" id="kpiSisTotal">-</div><div class="kpi-sub">Total de chamados</div></div>
          <div class="kpi-card" style="border-left: 3px solid var(--blue);"><div class="kpi-label" style="color:var(--blue);">Municípios Afetados</div><div class="kpi-val" id="kpiSisMuns" style="color:var(--blue);">-</div><div class="kpi-sub">Cidades atendidas</div></div>
          <div class="kpi-card" style="border-left: 3px solid var(--green);"><div class="kpi-label" style="color:var(--green);">Georreferenciados</div><div class="kpi-val" id="kpiSisCoords" style="color:var(--green);">-</div><div class="kpi-sub">Pontos no mapa</div></div>
          <div class="kpi-card" style="border-left: 3px solid var(--purple);"><div class="kpi-label" style="color:var(--purple);">Epicentro Municipal</div><div class="kpi-val" id="kpiSisTopMun" style="font-size:15px; color:var(--purple);">-</div><div class="kpi-sub" id="kpiSisTopMunSub">Maior volume</div></div>
        `;

        cFiltros.innerHTML = `
          <div class="filter-group"><label>Região (REDEC)</label><select id="filtroRedec"><option value="TODAS">Todas as REDECs</option></select></div>
          <div class="filter-group"><label>Município</label><select id="filtroMun"><option value="TODOS">Todos os Municípios</option></select></div>
          <div class="filter-group"><label>Tipo de Ocorrência</label><select id="filtroTipo"><option value="TODAS">Todos os Tipos</option></select></div>
          <div class="filter-group"><label>Pesquisar</label><input type="text" id="filtroTexto" placeholder="Bairro ou endereço..."></div>
        `;

        cGraficos.innerHTML = `
          <div class="chart-panel"><div class="chart-header"><div class="chart-title">Top Municípios SISGEO</div></div><div id="chartSisgeoMuns"></div></div>
          <div class="chart-panel"><div class="chart-header"><div class="chart-title">Tipologias Principais</div></div><div id="chartSisgeoTipos"></div></div>
        `;
      } else if (tipo === "eventos") {
        cKPIs.innerHTML = `
          <div class="kpi-card" style="border-left: 3px solid var(--orange);"><div class="kpi-label">Ocorrências</div><div class="kpi-val" id="kpiOcorr">-</div><div class="kpi-sub">Total computado</div></div>
          <div class="kpi-card" style="border-left: 3px solid var(--red);"><div class="kpi-label" style="color:var(--red);">Óbitos</div><div class="kpi-val" id="kpiObitos" style="color:var(--red);">-</div><div class="kpi-sub" id="kpiDesap">- desaparecidos</div></div>
          <div class="kpi-card" style="border-left: 3px solid var(--amber);"><div class="kpi-label" style="color:var(--amber);">Desabrigados</div><div class="kpi-val" id="kpiDesab" style="color:var(--amber);">-</div><div class="kpi-sub">Acolhimento público</div></div>
          <div class="kpi-card" style="border-left: 3px solid var(--blue);"><div class="kpi-label" style="color:var(--blue);">Desalojados</div><div class="kpi-val" id="kpiDesal" style="color:var(--blue);">-</div><div class="kpi-sub">Com parentes</div></div>
        `;

        cFiltros.innerHTML = `
          <div class="filter-group"><label>REDEC</label><select id="filtroRedec"><option value="TODAS">Todas</option></select></div>
          <div class="filter-group"><label>Município</label><select id="filtroMun"><option value="TODOS">Todos</option></select></div>
          <div class="filter-group"><label>Tipologia</label><select id="filtroTipo"><option value="TODAS">Todas</option><option value="desliz">Deslizamento</option><option value="inund">Inundação</option><option value="arvore">Árvore</option><option value="desabam">Desabamento</option></select></div>
          <div class="filter-group"><label>Busca Livre</label><input type="text" id="filtroTexto" placeholder="Pesquisar relato..."></div>
        `;

        cGraficos.innerHTML = `
          <div class="chart-panel"><div class="chart-header"><div class="chart-title">Ocorrências por REDEC</div></div><div id="chartRedecBarras"></div></div>
          <div class="chart-panel"><div class="chart-header"><div class="chart-title">Desalojados por REDEC</div></div><div id="chartDanosBarras"></div></div>
        `;
      }

      popularDropdownsModulo(tipo);
      anexarEventosModulo();
    }

    function popularDropdownsModulo(tipo) {
      const selRedec = document.getElementById("filtroRedec");
      const selMun = document.getElementById("filtroMun");
      const selTipo = document.getElementById("filtroTipo");

      if (selRedec) {
        const redecs = [...new Set(Object.values(MAPA_REDECS_RJ))].sort();
        redecs.forEach(r => selRedec.innerHTML += `<option value="${r}">${r}</option>`);
      }
      if (selMun) {
        const muns = Object.keys(MAPA_REDECS_RJ).sort((a,b) => a.localeCompare(b, "pt-BR"));
        muns.forEach(m => selMun.innerHTML += `<option value="${m}">${m}</option>`);
      }
      if (selTipo && tipo === "sisgeo") {
        const tipos = [...new Set(todosRegistros.map(r => r.tipo).filter(Boolean))].sort();
        tipos.forEach(t => selTipo.innerHTML += `<option value="${t}">${t}</option>`);
      }
    }

    function anexarEventosModulo() {
      const inputs = document.querySelectorAll("#containerFiltros select, #containerFiltros input");
      inputs.forEach(el => {
        el.addEventListener("change", () => {
          if (el.id === "filtroRedec") {
            redecAtiva = el.value;
          }
          filtrar();
        });
        el.addEventListener("input", filtrar);
      });
    }

    function definirLimitesDatasIniciais() {
      const datas = todosRegistros.map(r => r.d_iso).filter(Boolean).sort();
      if (datas.length === 0) return;

      const dIni = document.getElementById("dataInicio");
      const dFim = document.getElementById("dataFim");
      dIni.min = datas[0]; dIni.max = datas[datas.length - 1];
      dFim.min = datas[0]; dFim.max = datas[datas.length - 1];
      dIni.value = datas[0]; dFim.value = datas[datas.length - 1];
    }

    /* =========================================================================
       5. FILTRAGEM REATIVA E RENDERIZAÇÃO
       ========================================================================= */
    function filtrar() {
      const conf = CONFIG_MODULOS[abaAtiva] || { tipo: "generico", temPeriodo: false };
      const tipo = conf.tipo;

      const dtIni = document.getElementById("dataInicio").value;
      const dtFim = document.getElementById("dataFim").value;
      const fTexto = normalizarTexto(document.getElementById("filtroTexto")?.value);
      const fRedec = document.getElementById("filtroRedec")?.value;
      const fMun = document.getElementById("filtroMun")?.value;
      const fTipo = document.getElementById("filtroTipo")?.value;

      filtrados = todosRegistros.filter(item => {
        if (conf.temPeriodo && item.d_iso) {
          if (dtIni && item.d_iso < dtIni) return false;
          if (dtFim && item.d_iso > dtFim) return false;
        }

        // Comparação com normalização de texto (ignora maiúsculas/minúsculas)
        if (fRedec && fRedec !== "TODAS") {
          if (normalizarTexto(item.r) !== normalizarTexto(fRedec)) return false;
        }
        if (fMun && fMun !== "TODOS") {
          if (normalizarTexto(item.m) !== normalizarTexto(fMun)) return false;
        }

        if (tipo === "sisgeo") {
          if (fTipo && fTipo !== "TODAS" && item.tipo !== fTipo) return false;
          if (fTexto && !normalizarTexto(`${item.m} ${item.bairro} ${item.endereco} ${item.tipo} ${item.subtipo}`).includes(fTexto)) return false;
        } else if (tipo === "eventos") {
          if (fTipo === "desliz" && !(item.dz > 0)) return false;
          if (fTipo === "inund" && !(item.in > 0)) return false;
          if (fTipo === "arvore" && !(item.ar > 0)) return false;
          if (fTipo === "desabam" && !(item.es > 0)) return false;
          if (fTexto && !normalizarTexto(`${item.r} ${item.m} ${item.desc} ${item.dc}`).includes(fTexto)) return false;
        }

        return true;
      });

      if (conf.temPeriodo && dtIni && dtFim) {
        document.getElementById("periodoResumoLabel").textContent = `Exibindo: ${formatarParaDDMMAAAA(dtIni)} até ${formatarParaDDMMAAAA(dtFim)} (${filtrados.length} registros)`;
      }

      atualizarKPIs(tipo);
      atualizarGraficos(tipo);
      atualizarCamadasMapa();
      pagina = 1;
      renderizarTabela();
    }

    function atualizarKPIs(tipo) {
      if (tipo === "sisgeo") {
        const total = filtrados.length;
        const munsSet = new Set(filtrados.map(i => i.m).filter(m => m && !m.includes("NÃO INFORMADO")));
        const comCoords = filtrados.filter(i => i.tem_coords).length;

        const contMun = {};
        filtrados.forEach(i => { if (i.m) contMun[i.m] = (contMun[i.m] || 0) + 1; });
        const topMunSort = Object.entries(contMun).sort((a, b) => b[1] - a[1]);
        const topNome = topMunSort.length > 0 ? topMunSort[0][0] : "-";
        const topQtd = topMunSort.length > 0 ? topMunSort[0][1] : 0;

        document.getElementById("kpiSisTotal").textContent = Number(total).toLocaleString('pt-BR');
        document.getElementById("kpiSisMuns").textContent = munsSet.size;
        document.getElementById("kpiSisCoords").textContent = `${Number(comCoords).toLocaleString('pt-BR')} (${total > 0 ? Math.round((comCoords/total)*100) : 0}%)`;
        document.getElementById("kpiSisTopMun").textContent = topNome;
        document.getElementById("kpiSisTopMunSub").textContent = `${topQtd} chamados`;
      } else if (tipo === "eventos") {
        const sum = (fn) => filtrados.reduce((a, b) => a + (fn(b) || 0), 0);
        document.getElementById("kpiOcorr").textContent = Number(sum(b => b.o)).toLocaleString('pt-BR');
        document.getElementById("kpiObitos").textContent = Number(sum(b => b.ob)).toLocaleString('pt-BR');
        document.getElementById("kpiDesab").textContent = Number(sum(b => b.db)).toLocaleString('pt-BR');
        document.getElementById("kpiDesal").textContent = Number(sum(b => b.dl)).toLocaleString('pt-BR');
      }
    }

    function atualizarGraficos(tipo) {
      if (tipo === "sisgeo") {
        const munMap = {}, tipoMap = {};
        filtrados.forEach(i => {
          if (i.m && !i.m.includes("NÃO INFORMADO")) munMap[i.m] = (munMap[i.m] || 0) + 1;
          if (i.tipo) tipoMap[i.tipo] = (tipoMap[i.tipo] || 0) + 1;
        });

        renderizarBarraGenerica("chartSisgeoMuns", munMap, "var(--orange)", "chamados");
        renderizarBarraGenerica("chartSisgeoTipos", tipoMap, "var(--blue)", "chamados");
      } else if (tipo === "eventos") {
        const redecMap = {}, danosMap = {};
        filtrados.forEach(i => {
          if (!i.r || i.r.includes("ESTADUAL")) return;
          redecMap[i.r] = (redecMap[i.r] || 0) + (i.o || 1);
          danosMap[i.r] = (danosMap[i.r] || 0) + (i.dl || 0);
        });
        renderizarBarraGenerica("chartRedecBarras", redecMap, "var(--orange)");
        renderizarBarraGenerica("chartDanosBarras", danosMap, "var(--blue)", "pessoas");
      }
    }

    function renderizarBarraGenerica(elemId, dataMap, cor, sufixo = "") {
      const el = document.getElementById(elemId);
      if (!el) return;
      el.innerHTML = "";
      const sorted = Object.entries(dataMap).sort((a, b) => b[1] - a[1]);
      const maxVal = sorted.length > 0 ? sorted[0][1] : 1;

      if (sorted.length === 0) {
        el.innerHTML = `<div style="font-size:10.5px; color:var(--text-muted); padding:6px 0;">Sem registros.</div>`;
        return;
      }

      sorted.slice(0, 6).forEach(([label, val]) => {
        const perc = Math.round((val / maxVal) * 100);
        el.innerHTML += `
          <div class="bar-row">
            <div class="bar-label-line">
              <span style="font-weight:600; color:#cbd5e1;">${label}</span>
              <span style="font-weight:700; color:#fff;">${Number(val).toLocaleString('pt-BR')} ${sufixo}</span>
            </div>
            <div class="bar-track"><div class="bar-fill" style="width:${perc}%; background:${cor};"></div></div>
          </div>`;
      });
    }

    function renderizarTabela() {
      const conf = CONFIG_MODULOS[abaAtiva] || { tipo: "generico" };
      const tipo = conf.tipo;
      const thead = document.getElementById("tabelaCabecalho");
      const tbody = document.getElementById("tabelaCorpo");
      thead.innerHTML = ""; tbody.innerHTML = "";

      const total = filtrados.length;
      const totalPags = Math.ceil(total / porPagina) || 1;
      document.getElementById("tabelaContador").textContent = `${total} registro(s)`;
      document.getElementById("pageTxt").textContent = `Pág. ${pagina} / ${totalPags}`;
      document.getElementById("btnAnt").disabled = (pagina <= 1);
      document.getElementById("btnProx").disabled = (pagina >= totalPags);

      if (total === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:20px; color:var(--text-muted);">Nenhum registro encontrado.</td></tr>`;
        return;
      }

      const inicio = (pagina - 1) * porPagina;
      const itens = filtrados.slice(inicio, inicio + porPagina);

      if (tipo === "sisgeo") {
        thead.innerHTML = `
          <tr>
            <th>Data/Hora</th>
            <th>Município</th>
            <th>Tipologia</th>
            <th style="min-width:160px;">Endereço</th>
            <th>Viatura</th>
            <th style="text-align:center;">GPS</th>
          </tr>`;

        itens.forEach(i => {
          tbody.innerHTML += `
            <tr>
              <td style="white-space:nowrap; font-family:monospace; color:var(--text-muted);">
                <div style="color:#cbd5e1; font-weight:600;">${i.d_fmt}</div>
                <div style="font-size:10px;">${i.h}</div>
              </td>
              <td style="white-space:nowrap;">
                <div style="font-weight:700; color:#fff;">${i.m}</div>
                <div style="font-size:10px; color:var(--text-muted);">${i.bairro || '-'}</div>
              </td>
              <td>
                <span class="badge badge-arvore">${i.tipo}</span>
                <div style="color:var(--text-muted); font-size:10px;">${i.subtipo || ''}</div>
              </td>
              <td style="color:var(--text-muted); font-size:10px;">${i.endereco || '-'}</td>
              <td style="white-space:nowrap; font-family:monospace; color:#38bdf8;">${i.viatura || '-'}</td>
              <td style="text-align:center;">${i.tem_coords ? `<span class="badge badge-ativo">OK</span>` : `<span class="badge" style="background:#334155; color:#94a3b8;">-</span>`}</td>
            </tr>`;
        });
      }
    }

    let resizeDebounce = null;
    window.addEventListener("resize", () => {
      clearTimeout(resizeDebounce);
      resizeDebounce = setTimeout(() => {
        if (mapInstance) {
          mapInstance.invalidateSize({ animate: false });
          if (currentScopeBounds && currentScopeBounds.isValid()) {
            mapInstance.fitBounds(currentScopeBounds, { padding: [14, 14], animate: false });
          }
        }
      }, 180);
    });
  </script>
</body>
</html>
